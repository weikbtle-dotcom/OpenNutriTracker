name: Build zh-Hant debug APK

# Personal fork: builds an installable debug APK carrying the Hong Kong
# Traditional Chinese strings in lib/l10n/intl_zh.arb.
# Steps mirror the upstream android-build job so the same codegen runs.

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/l10n/intl_zh.arb'
      - '.github/workflows/build-zh-hant-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          java -version

      # envied reads .env at codegen time; CI has no real values.
      - name: Generate stub .env for CI
        uses: ./.github/actions/write-env-file
        with:
          sentry_dns: https://stub@sentry.io/0
          supabase_project_url: https://stub.supabase.co
          supabase_project_anon_key: ci-stub

      - name: Resolve dependencies
        run: flutter pub get

      # Produces lib/core/utils/env.g.dart, Hive adapters, JSON serializers.
      - name: Generate code (env.g.dart, Hive adapters, JSON serializers)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        run: flutter build apk --flavor full --debug

      - name: Show what was built
        run: find build/app/outputs -name '*.apk' -type f -exec ls -lh {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: opennutritracker-zh-hant-debug
          path: build/app/outputs/**/*.apk
          if-no-files-found: error
