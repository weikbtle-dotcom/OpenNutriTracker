name: Build zh-Hant debug APK

# Personal fork: builds an installable debug APK with the Hong Kong
# Traditional Chinese strings in lib/l10n/intl_zh.arb.
# Nothing here touches upstream; it only runs on this fork.

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/l10n/intl_zh.arb'
      - '.github/workflows/build-zh-hant-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          java -version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --flavor full --debug

      - name: Show what was built
        run: find build/app/outputs -name '*.apk' -type f -exec ls -lh {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: opennutritracker-zh-hant-debug
          path: build/app/outputs/**/*.apk
          if-no-files-found: error
